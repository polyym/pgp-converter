[[headers]]
  for = "/*"
  [headers.values]
    # The domain was submitted to the HSTS preload list (hstspreload.org) on 14
    # November 2026. While it is listed, this header must keep a max-age of at
    # least a year, includeSubDomains and preload, or the domain is dropped from
    # the list, and every subdomain must serve HTTPS.
    # scripts/preload-header.test.ts checks the header.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # The app uses none of these features, so no script on the page may use them
    Permissions-Policy = "accelerometer=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # No Content-Security-Policy here: it lists the hash of each page's inline
    # start-up script, which changes with every build, so scripts/write-csp.ts
    # writes it into build/_headers. Do not add one here: browsers enforce every
    # policy they receive.

# The file names carry a content hash, so browsers may cache them for a year
# without revalidating. adapter-static writes no host configuration, so the
# rule lives here.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, immutable, max-age=31536000"

# Netlify does not know the .webmanifest extension and would send a generic
# Content-Type. Browsers accept either; this is the media type the W3C Web
# Application Manifest registers (https://www.w3.org/TR/appmanifest/).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The About page was called Help until v3.0. force: the build still holds a
# help.html that redirects in the browser as a fallback, and without force
# Netlify would serve that file instead.
[[redirects]]
  from = "/help"
  to = "/about"
  status = 301
  force = true

# The app treats pgp-converter.netlify.app as a test copy, so send it to the
# domain. Staging and preview deploys have hostnames of their own and are not
# affected. scripts/verify-deploy.ts warns if this redirect stops working.
[[redirects]]
  from = "https://pgp-converter.netlify.app/*"
  to = "https://pgp-converter.com/:splat"
  status = 301
  force = true
