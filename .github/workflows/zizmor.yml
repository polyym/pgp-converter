# Checks the workflows, and Dependabot's settings, for security problems with
# zizmor (https://docs.zizmor.sh), and fails on any finding. Its settings are in
# .github/zizmor.yml. It runs beside the Tests workflow, on every push to main
# or dev and on every pull request into either.

name: zizmor

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Adds the "Run workflow" button on the Actions page
  workflow_dispatch:

# Actions are named by commit, not by tag; see the note in deploy.yml
permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    # The same runner image as the other workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The action installs the version of zizmor that its own commit names, from
      # a list of hashes. A new release of zizmor, which can bring new checks,
      # therefore arrives only with a reviewed update of the action.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Findings go to the run's log and annotations, not to the Security tab
          advanced-security: false
          annotations: true
