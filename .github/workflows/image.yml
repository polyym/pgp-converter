# Publishes the Docker image to GitHub's container registry for each release,
# for 64-bit x86 and ARM machines (linux/amd64 and linux/arm64):
#   ghcr.io/polyym/pgp-converter:<version>  the release's version, for example 4.2.0
#   ghcr.io/polyym/pgp-converter:<commit>   the full hash of the release's commit
#
# Publishing a release on GitHub starts it, and so does publishing one again
# with a patch's tag (README, "Releases"). The tag must be the version in
# package.json. Anyone can check the image's attestation with:
#   gh attestation verify oci://ghcr.io/polyym/pgp-converter:<version> --repo polyym/pgp-converter
#
# check:   builds the site as a production deploy does, and keeps it for verify.
#          Builds the image, runs it, and compares what it serves with that
#          build, file for file and policy for policy (scripts/verify-deploy.ts
#          --self-hosted), before anything is pushed. It runs the project's
#          packages, so it is given no write permission.
# publish: builds the image for both platforms and pushes it by its digest,
#          with no tag yet. The project's packages run only inside the
#          image's build, which cannot reach this job's token.
# verify:  checks what was pushed against check's build: the x86 image is run
#          and compared address by address, and the ARM image's files are
#          compared with that build and its server settings with the x86
#          image's. It installs nothing.
# attest:  signs the checked image with Sigstore, by its name and digest.
# release: tags the checked, signed image with the version and the commit.
# A run that fails before release leaves no tag on anything, so nobody pulls an
# image that did not pass.
#
# GitHub makes the package private the first time an image is pushed. It has
# to be made public once, in the package's settings.

name: Image

on:
  release:
    types: [published]

# Actions are named by commit, not by tag; see the note in deploy.yml
permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/polyym/pgp-converter

jobs:
  check:
    # The runner image that builds the live site in deploy.yml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the tag is the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "$version" != "$TAG" ]; then
            echo "::error::The release's tag ($TAG) is not the version in package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # No package cache: a release is built from nothing that an earlier run left
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: npm install --no-audit --no-fund

      # Named after this commit, with its dates taken from the commit, as in deploy.yml
      - name: Take the build date from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build the site
        run: npm run build

      # A build argument given with no value is taken from the environment
      - name: Build the image
        run: docker build --build-arg GITHUB_SHA --build-arg SOURCE_DATE_EPOCH --tag pgp-converter .

      - name: Start the image
        run: docker run --detach --publish 8080:8080 pgp-converter

      - name: Check the image serves the build
        run: node scripts/verify-deploy.ts http://localhost:8080 build --self-hosted

      # Hidden files included: security.txt lives in .well-known
      - name: Keep the build for verify
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Take the build date from the commit
        id: date
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and push it by its digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out files, not a fresh fetch of the repository
          context: .
          platforms: linux/amd64,linux/arm64
          # The attestation in attest is the signed one; BuildKit's own would be unsigned
          provenance: false
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.date.outputs.epoch }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The package's page shows the description it finds on the image's index
          annotations: |
            index:org.opencontainers.image.description=PGP Converter: encrypt, decrypt, sign and verify with PGP in the browser
          # No tag: release adds the tags once the image has been checked and signed
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

  verify:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the image while the package is still private
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pushed x86 image serves the build
        run: |
          docker run --detach --name x86 --publish 8080:8080 --platform linux/amd64 "$IMAGE@$DIGEST"
          node scripts/verify-deploy.ts http://localhost:8080 build --self-hosted
          docker cp x86:/etc/caddy x86-server

      # The runner cannot start an ARM image, but it can open one and read its
      # files. Its Docker keeps one image for each digest, so the x86 one goes first.
      - name: Check the pushed ARM image holds the same files and server settings
        run: |
          docker rm --force x86
          docker image rm "$IMAGE@$DIGEST"
          docker create --name arm --platform linux/arm64 "$IMAGE@$DIGEST"
          docker cp arm:/srv arm-files
          docker cp arm:/etc/caddy arm-server
          diff --recursive build arm-files
          diff --recursive x86-server arm-server

  attest:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # mint OIDC token for Sigstore
      attestations: write # write attestation to GitHub
    steps:
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.publish.outputs.digest }}

  release:
    needs: [check, publish, attest]
    runs-on: ubuntu-24.04
    permissions:
      packages: write # tag the image
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags must name the very image that was checked and signed. The
      # index the tags would point at is compared with it before any tag moves,
      # and both tags are read back after.
      - name: Tag the image with the version and the commit
        # bash with pipefail, so that a failed dry run stops the step with its own error
        shell: bash
        run: |
          would=$(docker buildx imagetools create --dry-run "$IMAGE@$DIGEST" | head --bytes=-1 | sha256sum | cut --delimiter=' ' --fields=1)
          if [ "sha256:$would" != "$DIGEST" ]; then
            echo "::error::Tagging would point at sha256:$would, not the checked image $DIGEST; no tag was moved"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:$GITHUB_SHA" "$IMAGE@$DIGEST"
          for tag in "$VERSION" "$GITHUB_SHA"; do
            tagged=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag names $tagged, not the checked image $DIGEST"
              exit 1
            fi
          done
