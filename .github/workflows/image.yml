# The image is pushed by digest only. It is tagged after verify has checked
# what was pushed and attest has signed it, so a run that fails before the
# release job leaves no tag.
#
# The release's tag must equal the version in package.json. GitHub does not
# take a new package's visibility from the repository, so after the first
# release, check that the image pulls without signing in.

name: Image

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/polyym/pgp-converter

jobs:
  # Builds the site and the image, and checks the image serves exactly that
  # build. It runs the project's packages, so it gets no write permission.
  check:
    # deploy.yml's runner, so check builds the site as production does
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the tag is the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [ "$version" != "$TAG" ]; then
            echo "::error::The release's tag ($TAG) is not the version in package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}

      # No package cache: a release build takes nothing from earlier runs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: npm install --no-audit --no-fund

      - name: Take the build date from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build the site
        run: npm run build

      - name: Build the image
        run: docker build --build-arg GITHUB_SHA --build-arg SOURCE_DATE_EPOCH --tag pgp-converter .

      # A short health interval, so the HEALTHCHECK is tested without waiting 30 seconds
      - name: Start the image
        run: docker run --detach --name site --health-interval=2s --publish 8080:8080 pgp-converter

      - name: Wait for the image to report healthy
        env:
          HEALTHY_WITHIN_SECONDS: 60
        run: |
          timeout "$HEALTHY_WITHIN_SECONDS" bash -c \
            'until [ "$(docker inspect --format "{{.State.Health.Status}}" site)" = healthy ]; do sleep 1; done' ||
            { docker inspect --format '{{json .State.Health}}' site; exit 1; }

      - name: Check the image serves the build
        run: node scripts/verify-deploy.ts http://localhost:8080 build --self-hosted

      # include-hidden-files: security.txt is in .well-known
      - name: Keep the build for verify
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build
          include-hidden-files: true
          if-no-files-found: error

  # The project's packages run only inside the image build, which cannot reach
  # this job's token
  publish:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Take the build date from the commit
        id: date
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and push it by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # attest signs the provenance; BuildKit's own would be unsigned
          provenance: false
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.date.outputs.epoch }}
          labels: |
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The package page reads its description from the index
          annotations: |
            index:org.opencontainers.image.description=PGP Converter: encrypt, decrypt, sign and verify with PGP in the browser
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

  # Checks the pushed image against check's build. It installs nothing.
  verify:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the image while the package is private
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pushed x86 image serves the build
        run: |
          docker run --detach --name x86 --publish 8080:8080 --platform linux/amd64 "$IMAGE@$DIGEST"
          node scripts/verify-deploy.ts http://localhost:8080 build --self-hosted
          docker cp x86:/etc/caddy x86-server

      # The x86 runner cannot run the ARM image, so its files are compared
      # instead. The runner's Docker stores one image per digest, so the x86
      # image has to be removed before the ARM one can be pulled.
      - name: Check the pushed ARM image has the same files and server settings
        run: |
          docker rm --force x86
          docker image rm "$IMAGE@$DIGEST"
          docker create --name arm --platform linux/arm64 "$IMAGE@$DIGEST"
          docker cp arm:/srv arm-files
          docker cp arm:/etc/caddy arm-server
          diff --recursive build arm-files
          diff --recursive x86-server arm-server

  attest:
    needs: [publish, verify]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # sign with Sigstore
      attestations: write # store the attestation
    steps:
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.publish.outputs.digest }}

  release:
    needs: [check, publish, attest]
    runs-on: ubuntu-24.04
    permissions:
      packages: write # tag the image
    env:
      DIGEST: ${{ needs.publish.outputs.digest }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The minor, major and latest tags move only for a full release, and never
      # back. A pre-release gets only its version and commit tags, and
      # re-publishing the 4.1 release after 4.2.0 tags it 4.1 but leaves 4 and
      # latest on 4.2.0.
      - name: Choose the tags
        id: tags
        shell: bash # unlike the default shell, sets pipefail
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Fetched on its own, so that a failed fetch stops the step instead of
          # leaving the list empty, which would make this release the newest
          refs=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          versions=$(sed 's|.*refs/tags/||' <<< "$refs" | grep --line-regexp --extended-regexp '[0-9]+\.[0-9]+\.[0-9]+' || true)
          newest() {
            printf '%s\n' "$VERSION" "$versions" | grep "^$1" | sort --version-sort | tail --lines=1
          }
          IFS=. read -r major minor _ <<< "$VERSION"
          tags="$VERSION $GITHUB_SHA"
          if [ "$PRERELEASE" = false ]; then
            if [ "$(newest "$major\.$minor\.")" = "$VERSION" ]; then tags="$tags $major.$minor"; fi
            if [ "$(newest "$major\.")" = "$VERSION" ]; then tags="$tags $major"; fi
            if [ "$(newest '')" = "$VERSION" ]; then tags="$tags latest"; fi
          fi
          echo "Tags: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # imagetools create writes a new index for the tags, which could differ
      # from the one that was checked and signed. The dry run prints that index;
      # its hash (without the trailing newline) must be the checked digest.
      - name: Tag the checked image
        shell: bash # unlike the default shell, sets pipefail
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          would=$(docker buildx imagetools create --dry-run "$IMAGE@$DIGEST" | head --bytes=-1 | sha256sum | cut --delimiter=' ' --fields=1)
          if [ "sha256:$would" != "$DIGEST" ]; then
            echo "::error::Tagging would point at sha256:$would, not the checked image $DIGEST; no tag was moved"
            exit 1
          fi
          read -r -a tags <<< "$TAGS"
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            tagged=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag names $tagged, not the checked image $DIGEST"
              exit 1
            fi
          done
