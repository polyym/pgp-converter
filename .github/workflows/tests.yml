name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Read-only: the job runs the code of every installed package
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main's branch rule requires a check named "test". Renaming this job, giving
  # it a display name or adding a matrix changes the check's name, and nothing
  # can be merged into main until the rule is updated.
  test:
    # Not ubuntu-latest: Ubuntu 26.04 ships libgcrypt 1.12.0, with which GnuPG
    # cannot use any imported Curve25519 private key, so the GnuPG interop test
    # would skip the default key type (README, "Known Issues"). Move to a newer
    # image once it has libgcrypt 1.12.1 or later; deploy.yml and image.yml's
    # check job use this one too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm

      # npm install, not npm ci: npm ci stops when the lockfile lacks another
      # platform's optional packages, which some npm versions leave out
      # (https://github.com/npm/cli/issues/10043). Switch to npm ci once that is
      # fixed. With the lockfile in sync, both install the same versions.
      - run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Production build
        run: npm run build

      # Fails if the homepage, About or Donate would preload OpenPGP.js
      - name: Check page weight
        run: node scripts/check-bundle.ts build
