# Runs the unit test suite, type check, and production build on every push to
# main and every pull request. Intended as the canonical validation workflow
# and the status check to require for branch protection on main.
#
# It can also be started by hand: Actions → Tests → Run workflow. That runs the
# checks on the chosen branch without pushing or deploying anything.
#
# Tests also run inline as a step in deploy.yml; the duplication is deliberate
# so neither workflow can skip the other's validation. On push to main both
# workflows fire in parallel; on pull_request only this workflow runs (the
# deploy workflow's preview job also runs, but keeps its own tests inline for
# the same reason).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds the "Run workflow" button on the Actions page
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Ubuntu 24.04 by name, not ubuntu-latest. The GnuPG round-trip test needs a
    # GnuPG that works, and Ubuntu 26.04 ships libgcrypt 1.12.0, with which GnuPG
    # cannot use any imported Curve25519 secret key, its own included (fixed
    # upstream in libgcrypt 1.12.1). On 26.04 the test would skip the default key
    # type with a warning instead of checking it. Move to a newer image once it
    # carries libgcrypt 1.12.1 or later; deploy.yml uses the same image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      # npm install, not npm ci: npm ci refuses to run when it judges the lockfile
      # incomplete, which npm's handling of other platforms' optional packages can
      # cause. With the lockfile in sync, this installs the same pinned versions.
      - run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build
