# Builds, attests, and deploys the site.
#
# On push to main:  runs tests → builds → signs the build output with
#                   Sigstore via GitHub's OIDC → deploys that exact output to
#                   Netlify prod → checks the live site serves the signed files.
# On pull_request:  runs tests → builds → deploys a preview URL to Netlify.
#
# Anyone can verify a deployed file with:
#   gh attestation verify <file-from-built-site> --repo polyym/pgp-converter
#
# The attestation only means something if the signed files are the ones that go
# live, so two things matter here:
#   1. The Netlify CLI rebuilds the project by default. --no-build makes it
#      upload build/ exactly as it is.
#   2. Netlify must not build the site itself. The Netlify project has no
#      repository linked (Project configuration → Developer settings →
#      Continuous deployment), so every deploy comes from this workflow. If
#      one is ever linked, Netlify will publish its own unsigned build over
#      the signed one.
# The final step of the production job fails if the live site differs from build/.
#
# The site is files only: every page is built ahead of time (SvelteKit's static
# adapter), 404.html included, which Netlify serves for an address that does
# not exist. The one function is the wallet proxy in netlify/functions, which
# the CLI packages itself under --no-build and which is reached at its default
# address (/.netlify/functions/<name>); the note in that file says why it has
# no custom path. The final step also fails if the wallet proxy cannot be reached.
#
# Required GitHub repo secrets:
#   NETLIFY_AUTH_TOKEN: personal access token from Netlify user settings
#   NETLIFY_SITE_ID:    Project ID from Netlify Project configuration → General

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are named by commit, not by tag: a tag can be moved to different code
# after it was reviewed, a commit cannot. The comment beside each one gives the
# release that commit is. Dependabot proposes the move to a newer release
# (.github/dependabot.yml).

# Each job asks for what it needs; previews get no signing permissions
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned so that a new CLI release cannot change what gets deployed, or run
  # with the deploy token, without a reviewed change to this file
  NETLIFY_CLI_VERSION: 27.16.3

jobs:
  preview:
    # Not for Dependabot's pull requests: they are not given the deploy secrets,
    # so the deploy step could only fail. The Tests workflow still runs on them.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    # Not ubuntu-latest: see the note on the job in tests.yml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm

      # npm install, not npm ci: npm ci refuses to run when it judges the lockfile
      # incomplete, which npm's handling of other platforms' optional packages can
      # cause. With the lockfile in sync, this installs the same pinned versions.
      - run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The same commit must always build the same files, so that anyone can
      # repeat the build and compare (README, "Reproducing a Build"). The one
      # thing in a build that depends on the clock, the dates it writes into the
      # sitemap and security.txt, is taken from the commit instead.
      - name: Take the build date from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Deploy preview
        # Written as a block: in a one-line YAML value, " #" starts a comment and
        # would cut the command off at the pull request number.
        # Up to three attempts, for the reason given on the production deploy step.
        run: |
          for attempt in 1 2 3; do
            if npx netlify-cli@${{ env.NETLIFY_CLI_VERSION }} deploy --no-build --dir=build --message="PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}"; then
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Not ubuntu-latest: see the note on the job in tests.yml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # mint OIDC token for Sigstore
      attestations: write # write attestation to GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      # Also in the Tests workflow, which runs beside this one and cannot stop
      # it: without these steps a change that fails the type check, the lint
      # rules or the formatting check would still go live
      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The same commit must always build the same files, so that anyone can
      # repeat the build and compare (README, "Reproducing a Build"). The one
      # thing in a build that depends on the clock, the dates it writes into the
      # sitemap and security.txt, is taken from the commit instead.
      - name: Take the build date from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # Before anything is signed or published: the homepage, About and Donate
      # must not download the cryptography library
      - name: Check page weight
        run: node scripts/check-bundle.ts build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'build/**/*'

      - name: Deploy to production
        # Up to three attempts, 20 and then 40 seconds apart. The CLI's first calls
        # to Netlify's API can fail for a moment, and it then reports "Project not
        # found" whatever the real cause was. Uploading the same files a second
        # time is harmless, so trying again is safe. Each failed attempt leaves a
        # warning on the run, so a deploy that needed a retry does not go unnoticed.
        run: |
          for attempt in 1 2 3; do
            if npx netlify-cli@${{ env.NETLIFY_CLI_VERSION }} deploy --prod --no-build --dir=build --message="Commit ${{ github.sha }}"; then
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Check the live site matches the signed build
        run: node scripts/verify-deploy.ts https://pgp-converter.com build
