# Only the deploy jobs get the Netlify token, so they must install none of the
# project's packages, any of which could read it. README, "Security", says what
# this does not cover.
#
# The signature covers what goes live only because --no-build stops the CLI
# rebuilding the site, and because the Netlify project has no linked repository
# (Project configuration > Developer settings > Continuous deployment). If one
# is ever linked, Netlify will publish its own unsigned build over the signed one.
#
# Secrets, set on the repository or on the preview, production and staging
# environments:
#   NETLIFY_AUTH_TOKEN: a Netlify personal access token
#   NETLIFY_SITE_ID:    the Project ID, from Project configuration > General
# Each deploy step stops if either is empty, because with no project ID the CLI
# creates a new Netlify project and deploys there.

name: Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Read-only for every job but attest, which sets its own
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # By path, not through npx, so a missing CLI fails the step instead of being
  # downloaded from the registry
  NETLIFY_CLI: .github/deploy/node_modules/.bin/netlify
  # A fixed alias, so the staging URL stays the same from one push to the next
  STAGING_ALIAS: dev
  STAGING_URL: https://dev--pgp-converter.netlify.app

jobs:
  build:
    # Not ubuntu-latest: see the note on the job in tests.yml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm

      # npm install, not npm ci: see the note in tests.yml
      - run: npm install --no-audit --no-fund

      # The Tests workflow runs the same checks, but in parallel, so it cannot
      # stop a failing change from being deployed
      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The build writes the sitemap and security.txt dates from SOURCE_DATE_EPOCH,
      # so the same commit always builds the same files (README, "Reproducing a Build")
      - name: Take the build date from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # Fails if the homepage, About or Donate would preload OpenPGP.js
      - name: Check page weight
        run: node scripts/check-bundle.ts build

      # Hidden files included: security.txt lives in .well-known
      - name: Keep the build for the jobs that follow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build
          include-hidden-files: true
          if-no-files-found: error

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # sign with Sigstore
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'build/**/*'

  preview:
    # Dependabot's pull requests get no deploy secrets, so this job could only fail
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      # Cone mode, the default, also checks out every file at the top of the
      # repository. netlify.toml arrives that way, so keep cone mode on.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/deploy
            netlify
            scripts

      # No package cache: a job that holds the token uses nothing an earlier run stored
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install the Netlify CLI from its lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - name: Deploy preview
        # The retries are explained on the production deploy step
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_SITE_ID or NETLIFY_AUTH_TOKEN is empty; see the note at the top of deploy.yml"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$NETLIFY_CLI" deploy --no-build --dir=build --message="PR #$PR_NUMBER @ $GITHUB_SHA"; then
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Deploys only the build that attest has signed
    needs: [build, attest]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://pgp-converter.com
    steps:
      # Set up as in the preview job; the notes there apply here too
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/deploy
            netlify
            scripts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install the Netlify CLI from its lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - name: Deploy to production
        # Up to three attempts, 20 and then 40 seconds apart. The CLI's first API
        # calls sometimes fail briefly, and it then reports "Project not found"
        # whatever the cause. Uploading the same files again is harmless.
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_SITE_ID or NETLIFY_AUTH_TOKEN is empty; see the note at the top of deploy.yml"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$NETLIFY_CLI" deploy --prod --no-build --dir=build --message="Commit $GITHUB_SHA"; then
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Check the live site matches the signed build
        run: node scripts/verify-deploy.ts https://pgp-converter.com build

  staging:
    # A branch rule lets only the maintainer push to dev, and a pull request into
    # dev does not start this job, so only the maintainer's pushes reach the token
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # Not attested: the attestation is for the files that go live
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    steps:
      # Set up as in the preview job; the notes there apply here too
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/deploy
            netlify
            scripts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install the Netlify CLI from its lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      # Netlify reads build/_headers but does not serve it, so the served files
      # stay identical to a production build of this commit. A block, not a
      # one-line value: in plain YAML the ": " in the header starts a mapping.
      - name: Ask search engines not to list the staging copy
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> build/_headers

      - name: Deploy to the staging address
        # The retries are explained on the production deploy step
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_SITE_ID or NETLIFY_AUTH_TOKEN is empty; see the note at the top of deploy.yml"
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$NETLIFY_CLI" deploy --no-build --dir=build --alias="$STAGING_ALIAS" --message="dev @ $GITHUB_SHA"; then
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Check the staging address serves this build
        run: node scripts/verify-deploy.ts "$STAGING_URL" build --staging
