# Updates target dev, so they reach the staging address before a release.
# GitHub reads this file from main, and opens security updates against main
# whatever target-branch says.
#
# With the cooldown, a release is proposed only once it is a week old, because
# a malicious release is usually found and pulled within days. Security updates
# are not held back.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # Major versions stay out of the group, so each one gets a pull request of its
  # own and is reviewed on its own
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # SvelteKit, svelte-check and typescript-eslint do not accept TypeScript 7
    # yet. Remove this once they do.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The Netlify CLI for deploy.yml, which has its own lockfile
  - package-ecosystem: npm
    directory: /.github/deploy
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
